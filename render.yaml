# Deploy em 1 clique no Render (https://render.com): "New → Blueprint" e aponte para o repositório.
services:
  - type: web
    name: problemas
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: TRUST_PROXY
        value: "1"
